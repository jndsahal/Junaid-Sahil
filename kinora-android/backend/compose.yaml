services:
  api:
    build: .
    restart: unless-stopped
    environment:
      KINORA_TURN_URLS: "turn:${KINORA_DOMAIN:?Set KINORA_DOMAIN}:3478?transport=udp,turn:${KINORA_DOMAIN}:3478?transport=tcp"
      KINORA_TURN_SECRET: "${KINORA_TURN_SECRET:?Set a random TURN secret}"
    volumes:
      - kinora-data:/data
    networks: [kinora]
  https:
    image: caddy:2
    restart: unless-stopped
    environment:
      KINORA_DOMAIN: "${KINORA_DOMAIN:?Set KINORA_DOMAIN}"
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [kinora]
    depends_on: [api]
  turn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    network_mode: host
    command:
      - --use-auth-secret
      - --static-auth-secret=${KINORA_TURN_SECRET:?Set a random TURN secret}
      - --realm=${KINORA_DOMAIN:?Set KINORA_DOMAIN}
      - --external-ip=${KINORA_PUBLIC_IP:?Set the public IPv4 address}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --no-tls
      - --no-dtls
      - --no-cli
      - --no-multicast-peers
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --user-quota=4
      - --total-quota=100
      - --log-file=stdout
networks:
  kinora:
volumes:
  kinora-data:
  caddy-data:
  caddy-config:
